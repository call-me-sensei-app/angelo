#
# Dependency-free host tests for every pull request and every push to main.
# They complement, and never replace, the native and GUI suites that need the
# compiled Angelo binary (see CONTRIBUTING.md and doc/angelo/agent_execution.rst).

name: Host tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    # The suite (about 12,200 tests) takes 15-20 minutes on a hosted runner, so 20 minutes cancelled runs mid-suite
    # by runner speed alone (2026-10-29: main and several PRs ran 19-21 min). Room for the suite to grow.
    timeout-minutes: 35
    env:
      # Branding and base-mesh thumbnail tests read Git LFS content; LFS bandwidth
      # is metered, so fetch just these paths and cache them by content hash.
      LFS_ASSETS: release/branding/angelo/**,release/windows/msix/Assets/**,scripts/addons_core/angelo_agent/assets/base_mesh_thumbs/**
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Identify required LFS objects
        run: |
          git lfs install --local
          git lfs ls-files --long --include="$LFS_ASSETS" | cut -d ' ' -f1 | sort > .lfs-asset-ids

      - name: Restore cached LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-assets-${{ hashFiles('.lfs-asset-ids') }}

      - name: Fetch LFS assets
        run: git lfs pull --include="$LFS_ASSETS"

      - name: Set up Python (bundled runtime version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip (hash-pinned; pip vendors its own root store)
        # pip before 26.2.2 trusts emSign ECC Root CA - G3 in its vendored certifi (GHSA-6q48-6c7w-9gw2), and
        # the runner's Python may bring an older one. The hash makes the download safe through the old pip.
        run: python -m pip install --require-hashes --no-deps -r .github/pip-bootstrap.txt

      - name: Fetch the pinned trust-store wheels
        # The exact certifi and pip a build installs (build_files/cmake/angelo_python_packages.json), hash-checked,
        # so test_native_trust_store checks the shipped stores instead of skipping.
        run: |
          python scripts/angelo/trust_store.py fetch-wheels --dest "$RUNNER_TEMP/angelo-wheels"
          echo "ANGELO_PYTHON_WHEELS_DIR=$RUNNER_TEMP/angelo-wheels" >> "$GITHUB_ENV"

      - name: Install optional test dependencies
        # NumPy matches the version bundled with Angelo; jsonschema enables the
        # standards-validation tests. Missing dependencies must never become expected skips.
        run: python -m pip install numpy==2.3.4 jsonschema==4.23.0

      - name: Run host tests (no unexpected skips)
        run: python tests/python/angelo_agent/run_host_tests.py --max-skips 0

  host-tests-windows:
    # The same suite on Windows, where Angelo also ships: path spelling, file modes, POSIX-only APIs and process
    # handling differ there, and nothing else runs these tests on Windows. Four shards (run_host_tests.py --shard)
    # run in parallel; each is one process, as the whole suite is on the other job. Platform skips carry
    # host_test_policy.environment_skip and are listed with their reasons; any other skip fails the shard.
    name: Host tests (Windows ${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    env:
      LFS_ASSETS: release/branding/angelo/**,release/windows/msix/Assets/**,scripts/addons_core/angelo_agent/assets/base_mesh_thumbs/**
      # The add-on runs in Blender's Python, which is always in UTF-8 mode (bpy_interface.cc sets
      # preconfig.utf8_mode); without it Windows' default text encoding is the ANSI code page, which no shipped
      # interpreter uses.
      PYTHONUTF8: "1"
    steps:
      - name: Keep line endings as committed
        # Git for Windows defaults to core.autocrlf=true; the tests digest and compare source files byte for byte, and
        # Angelo's Windows build checks its sources out unconverted.
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Identify required LFS objects
        run: |
          git lfs install --local
          git lfs ls-files --long --include="$LFS_ASSETS" | cut -d ' ' -f1 | sort > .lfs-asset-ids

      - name: Restore cached LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-assets-${{ hashFiles('.lfs-asset-ids') }}

      - name: Fetch LFS assets
        run: git lfs pull --include="$LFS_ASSETS"

      - name: Set up Python (bundled runtime version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip (hash-pinned; pip vendors its own root store)
        run: python -m pip install --require-hashes --no-deps -r .github/pip-bootstrap.txt

      - name: Fetch the pinned trust-store wheels
        run: |
          python scripts/angelo/trust_store.py fetch-wheels --dest "$RUNNER_TEMP/angelo-wheels"
          echo "ANGELO_PYTHON_WHEELS_DIR=$RUNNER_TEMP/angelo-wheels" >> "$GITHUB_ENV"

      - name: Install optional test dependencies
        run: python -m pip install numpy==2.3.4 jsonschema==4.23.0

      - name: Run host tests (no unexpected skips)
        run: python tests/python/angelo_agent/run_host_tests.py --max-skips 0 --shard ${{ matrix.shard }}/4
